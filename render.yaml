databases:
  - name: iles-db
    plan: free
    databaseName: iles
    user: iles

services:
  - type: web
    name: iles-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: bash build.sh
    startCommand: gunicorn iles_backend.wsgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: iles-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "http://localhost:5173"
